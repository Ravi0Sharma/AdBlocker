<!doctype html>

<html lang="sv">

<head>
     <meta charset="UTF-8">
     <title>AdBlocker</title>
     <link rel="stylesheet" href="css/styles.css">
</head>

<body class="w-80 bg-stone-100 p-4 font-sans text-stone-800 antialiased">
     <main class="rounded-2xl bg-white p-5 shadow-sm ring-1 ring-stone-200">
          <h1 class="text-center text-lg font-semibold tracking-tight">Salt AdBlocker</h1>
          <p class="mt-1 text-center text-sm text-stone-500">Protect your self from the ads Salty!</p>

          <div class="mt-5 grid grid-cols-2 gap-2">
               <button id="ButtenYes" class="cursor-pointer rounded-lg bg-stone-900 px-4 py-2 text-sm font-medium text-white transition hover:bg-stone-700 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-stone-900">Accept</button>
               <button id="ButtenNo" class="cursor-pointer rounded-lg bg-white px-4 py-2 text-sm font-medium text-stone-700 ring-1 ring-stone-300 transition hover:bg-stone-200 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-stone-900">Decline</button>
          </div>

          <p id="StatusBlocker" class="mt-4 rounded-md bg-stone-100 py-1.5 text-center text-xs font-medium text-stone-600"></p>
     </main>
     <script type="module" src="js/popup.js"></script>
</body>
</html>
